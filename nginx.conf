types {
    application/manifest+json webmanifest;
}

server {
    listen 80;
    server_name localhost;

    root /usr/share/nginx/html;
    index index.html;

    # Gzip Compression
    gzip on;
    gzip_types text/plain text/css application/json application/javascript text/xml application/xml application/xml+rss text/javascript image/svg+xml application/manifest+json;

    # SVERG v4 Healthcheck Probe
    location = /health {
        access_log off;
        default_type text/plain;
        return 200 "healthy\n";
    }

    # PWA Service Worker & WebManifest (no-cache)
    location ~* (sw\.js|registerSW\.js|manifest\.webmanifest)$ {
        add_header Cache-Control "no-cache, no-store, must-revalidate";
        add_header Pragma "no-cache";
        add_header Expires "0";
        try_files $uri =404;
    }

    # Hashed static bundle assets
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        try_files $uri =404;
    }

    # Single Page Application fallback
    location / {
        try_files $uri $uri/ /index.html;
    }
}
