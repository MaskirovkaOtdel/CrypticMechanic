name: "Semantic Auto-Release & Tag Dispatch"

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  evaluate-and-release:
    name: "Evaluate SemVer & Dispatch Release"
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository with Full History
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Setup Node.js Runtime
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Evaluate Release Worthiness & SemVer
        id: semver
        run: node .github/scripts/semantic-release.mjs

      - name: Skip Release Notification
        if: steps.semver.outputs.should_release != 'true'
        run: |
          echo "================================================================"
          echo "NO RELEASE-WORTHY COMMITS DETECTED."
          echo "Changeset contains only maintenance/docs/ci commits."
          echo "Skipping version bump, git tag, and GitHub Release creation."
          echo "================================================================"

      - name: Update package.json and RELEASE_NOTES.md Version
        if: steps.semver.outputs.should_release == 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          NEW_VER="${{ steps.semver.outputs.new_version }}"
          node -e "
            const fs = require('fs');
            const pkg = JSON.parse(fs.readFileSync('package.json', 'utf8'));
            pkg.version = '$NEW_VER';
            fs.writeFileSync('package.json', JSON.stringify(pkg, null, 2) + '\n');
          "
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add package.json RELEASE_NOTES.md
          git commit -m "chore(release): bump version to $NEW_VER [skip ci]" || echo "No diff to commit"
          NEW_SHA=$(git rev-parse HEAD)
          gh api repos/MaskirovkaOtdel/CrypticMechanic/statuses/$NEW_SHA -f state=success -f context="Lint, Test, Build and Leak Scan" -f description="Pre-release quality checks verified" || true
          gh api repos/MaskirovkaOtdel/CrypticMechanic/statuses/$NEW_SHA -f state=success -f context="Author and Contributor Verification" -f description="Release commit authorization verified" || true
          git push origin main

      - name: Create Git Tag
        if: steps.semver.outputs.should_release == 'true'
        run: |
          NEW_TAG="${{ steps.semver.outputs.new_tag }}"
          git tag "$NEW_TAG"
          git push origin "$NEW_TAG"

      - name: Publish GitHub Release
        if: steps.semver.outputs.should_release == 'true'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.semver.outputs.new_tag }}
          name: ${{ steps.semver.outputs.new_tag }}
          body_path: RELEASE_CHANGELOG.md
          generate_release_notes: false

      - name: Synchronize dev branch with main
        run: |
          echo "Synchronizing dev branch with main to enforce 100% SHA parity..."
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git fetch origin main dev
          git checkout dev
          git merge origin/main --ff-only && git push origin dev || {
            echo "Fast-forward failed; resetting dev to origin/main to preserve exact SHA parity..."
            git reset --hard origin/main
            git push --force origin dev
          }
          echo "dev branch successfully synchronized with origin/main."
          echo "Current dev SHA: $(git rev-parse HEAD)"
