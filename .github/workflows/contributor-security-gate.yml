name: Contributor & Commit Security Gate

on:
  push:
    branches: ["**"]
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review, labeled, unlabeled]
  pull_request_review:
    types: [submitted, dismissed]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read
  pull-requests: write
  issues: write

jobs:
  verify-author:
    name: Verify Author & Owner Authorization
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Source Tree
        uses: actions/checkout@v4
        with:
          fetch-depth: 2

      - name: Inspect Actor & Commit Signatures
        id: check
        shell: bash
        run: |
          OWNER_USERNAME="MaskirovkaOtdel"
          OWNER_EMAIL="thod.efstathiadis@gmail.com"

          ACTOR="${{ github.actor }}"
          COMMIT_AUTHOR_EMAIL=$(git log -1 --pretty=format:'%ae' 2>/dev/null || echo "")
          COMMIT_AUTHOR_NAME=$(git log -1 --pretty=format:'%an' 2>/dev/null || echo "")

          echo "Actor: $ACTOR"
          echo "Commit Author Name: $COMMIT_AUTHOR_NAME"
          echo "Commit Author Email: $COMMIT_AUTHOR_EMAIL"

          IS_OWNER=false
          if [ "$ACTOR" = "$OWNER_USERNAME" ] || [ "$COMMIT_AUTHOR_EMAIL" = "$OWNER_EMAIL" ]; then
            IS_OWNER=true
          fi

          echo "is_owner=$IS_OWNER" >> $GITHUB_OUTPUT
          echo "actor=$ACTOR" >> $GITHUB_OUTPUT
          echo "author_email=$COMMIT_AUTHOR_EMAIL" >> $GITHUB_OUTPUT

      - name: Handle Authorized Owner Commit
        if: steps.check.outputs.is_owner == 'true'
        shell: bash
        run: |
          echo "================================================================"
          echo "✅ VERIFIED REPOSITORY OWNER AUTHORIZATION"
          echo "Actor: ${{ steps.check.outputs.actor }}"
          echo "Author Email: ${{ steps.check.outputs.author_email }}"
          echo "Status: Automatically approved. All checks cleared."
          echo "================================================================"

      - name: Evaluate 3rd-Party Contributor PR Approval
        if: steps.check.outputs.is_owner == 'false' && github.event_name == 'pull_request'
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          PR_NUMBER="${{ github.event.pull_request.number }}"
          echo "External contribution detected from actor: ${{ steps.check.outputs.actor }}"
          echo "Checking for explicit authorization and approval by repository owner (@MaskirovkaOtdel)..."

          # Check if the PR has the 'owner-approved' label
          LABELS=$(gh pr view "$PR_NUMBER" --json labels -q '.labels[].name' 2>/dev/null || echo "")
          HAS_LABEL=false
          if echo "$LABELS" | grep -q "^owner-approved$"; then
            HAS_LABEL=true
          fi

          # Check if repository owner MaskirovkaOtdel has submitted an APPROVED review
          REVIEWS=$(gh pr view "$PR_NUMBER" --json reviews -q '.reviews[] | select(.author.login=="MaskirovkaOtdel") | .state' 2>/dev/null || echo "")
          IS_APPROVED_BY_OWNER=false
          if echo "$REVIEWS" | grep -q "APPROVED"; then
            IS_APPROVED_BY_OWNER=true
          fi

          if [ "$HAS_LABEL" = "true" ] || [ "$IS_APPROVED_BY_OWNER" = "true" ]; then
            echo "================================================================"
            echo "✅ 3rd-party contribution confirmed & approved by @MaskirovkaOtdel."
            echo "Security gate passed."
            echo "================================================================"
            exit 0
          fi

          echo "::error::SECURITY GATE BLOCKED: Third-party contribution from '${{ steps.check.outputs.actor }}' requires manual confirmation and review by repository owner @MaskirovkaOtdel (thod.efstathiadis@gmail.com) before merging."
          
          # Comment security status on PR if not already commented
          COMMENT_BODY="### 🛡️ Repository Security Gate — Manual Confirmation Required

Notice: This Pull Request was authored by external contributor **@${{ steps.check.outputs.actor }}**.

To prevent unauthorized actions and protect the codebase against catastrophic updates, changes submitted by third-party individuals require manual review and confirmation by repository owner **@MaskirovkaOtdel** (\`thod.efstathiadis@gmail.com\`).

**How to approve:**
1. Repository owner **@MaskirovkaOtdel** reviews the changes and submits an **Approved** review on this PR.
2. Or add the \`owner-approved\` label to this PR.

*This security gate will remain blocked until approval is granted.*"

          # Avoid duplicate warning spam
          EXISTING_COMMENT=$(gh pr view "$PR_NUMBER" --json comments -q '.comments[] | select(.body | contains("Repository Security Gate — Manual Confirmation Required")) | .id' 2>/dev/null || echo "")
          if [ -z "$EXISTING_COMMENT" ]; then
            gh pr comment "$PR_NUMBER" --body "$COMMENT_BODY" || true
          fi

          exit 1

      - name: Block Unapproved Direct Push by 3rd-Party Actors
        if: steps.check.outputs.is_owner == 'false' && github.event_name == 'push'
        shell: bash
        run: |
          echo "::error::CRITICAL REPO SECURITY: Direct push by unauthorized 3rd-party actor '${{ steps.check.outputs.actor }}' is strictly prohibited."
          echo "External contributors must submit Pull Requests for manual review and confirmation by @MaskirovkaOtdel."
          exit 1
